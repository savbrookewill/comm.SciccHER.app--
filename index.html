
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ScissHER">
  <meta name="theme-color" content="#030712">
  <title>ScissHER | Intentional Connection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose: #fb7185;
      --violet: #a855f7;
      --mint: #34d399;
      --obsidian: #030712;
      --pearl: #f1f5f9;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--obsidian);
      background-image: 
        radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(251, 113, 133, 0.15) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(52, 211, 153, 0.1) 0px, transparent 50%);
      color: var(--pearl);
      overflow-x: hidden;
      min-height: 100vh;
      letter-spacing: -0.01em;
      overscroll-behavior-y: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    
    .glass {
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .petal-gradient {
      background: linear-gradient(135deg, #fb7185 0%, #a855f7 50%, #6366f1 100%);
      background-size: 200% 200%;
      animation: gradient-shift 6s ease-in-out infinite;
    }

    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .shimmer-text {
      background: linear-gradient(90deg, #fb7185, #a855f7, #6366f1, #34d399, #fb7185);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 5s linear infinite;
    }

    .shimmer-btn {
      background: linear-gradient(90deg, #fb7185, #a855f7, #6366f1, #fb7185);
      background-size: 200% auto;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: shimmer 4s linear infinite;
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .sheet-grabber {
      width: 36px;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      margin: 12px auto;
    }

    .h-screen-ios {
      height: 100vh;
      height: -webkit-fill-available;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "@capacitor/haptics": "https://esm.sh/@capacitor/haptics@^6.0.0",
    "@capacitor/status-bar": "https://esm.sh/@capacitor/status-bar@^6.0.0"
  }
}
</script>
</head>
<body class="h-screen-ios overflow-hidden">
  <div id="root" class="h-full"></div>
</body>
</html>
